supertext_translate:
  path: supertext/translate
  methods: [GET, POST]
  defaults:
    _controller: 'Supertext\PrestaShop\Controller\Admin\TranslateController::translateAction'

supertext_translate_run:
  path: supertext/translate/run
  methods: [POST]
  defaults:
    _controller: 'Supertext\PrestaShop\Controller\Admin\TranslateController::runAction'

supertext_export:
  path: supertext/translate/export
  methods: [POST]
  defaults:
    _controller: 'Supertext\PrestaShop\Controller\Admin\TranslateController::exportAction'

supertext_import:
  path: supertext/translate/import
  methods: [POST]
  defaults:
    _controller: 'Supertext\PrestaShop\Controller\Admin\TranslateController::importAction'
